[project]
name = "wahlwerk"
version = "0.1.0"
description = "Rules-as-code engine for German electoral and parliamentary systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Julius Sommer", email = "julius_sommer@mailbox.org" }]
keywords = ["elections", "apportionment", "germany", "bundestag", "rules-as-code"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wahlwerk"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "m0: interface acceptance -- the six slots absorb the known quirks",
    "golden: reproduces an official result exactly; never skip, never xfail",
]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
ignore = [
    "N999", # module names carry German legal citations (bwahlg_2023, lwg_2022)
    "N818",  # UnresolvedTie is a lawful outcome surfaced as an exception, not an error
    "RUF012", # every class here is a frozen pydantic model; pydantic copies defaults
]

[tool.mypy]
# No python_version pin: the CI matrix runs mypy on 3.11, 3.12 and 3.13,
# which checks compatibility for real instead of by declaration.
strict = true
files = ["src", "tests"]
warn_unreachable = true
